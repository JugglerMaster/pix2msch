name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the exe to
        required: false
        default: pix2msch
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pillow pyperclip

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name pix2msch --add-data "background.png;." --add-data "examples;examples" gui.py

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          files: dist/pix2msch.exe
